[package]
name = "minesweepe-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.28"
ratatui-macros = "0.6"
color-to-tui = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
rand = "0.8"
tachyonfx = { version = "0.25", features = ["std-duration"] }
